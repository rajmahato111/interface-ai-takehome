[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handspan"
version = "1.0.0"
description = "Record-once / replay-many UI automation for legacy back-office apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "playwright>=1.45",
  "anthropic>=0.34",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "ruamel.yaml>=0.18",
  "httpx>=0.27",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "syrupy>=4.6",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
handspan = "handspan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handspan = ["operator/templates/*.html", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "targets"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "targets", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["handspan.schema", "handspan.replay", "handspan.policy"]
strict = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
