schema_version: "1.0.0"
capability:
  id: cap.member.read_savings_balance
  version: 1
  name: Read member savings balance
  description: >
    Looks up a member by member ID in the servicing console and returns the
    current savings balance shown on the member detail screen.
  status: approved
  labels: [member, read-only, balance]
target:
  surface:
    kind: web
    adapter: web_aria/1
  app:
    product: CoreVantage Servicing
    product_version: "9.4"
    tenant_scope: base
    entry: { url_template: "{base_url}/servicing/home", requires_session: true }
  allowlist_ref: policies/corevantage.yaml
inputs:
  - name: member_id
    type: string
    required: true
    pattern: "^[0-9]{6}$"
    sensitivity: identifier
    description: Institution member number
    example: "100234"
  - name: username
    type: string
    required: false
    default: teller
    sensitivity: secret
  - name: password
    type: string
    required: false
    default: teller
    sensitivity: secret
  - name: base_url
    type: string
    required: false
    default: "http://127.0.0.1:8081"
    sensitivity: public
  - name: fault
    type: string
    required: false
    sensitivity: public
outputs:
  - name: savings_balance
    type: money
    required: true
    source: { step: s4, extractor: ax_text, transform: parse_money }
    sensitivity: pii
  - name: account_status
    type: enum
    values: [active, dormant, frozen]
    required: false
    source: { step: s5, extractor: ax_text, transform: lower_trim }
    sensitivity: identifier
outcomes:
  - code: MEMBER_NOT_FOUND
    description: No member matches the supplied ID.
    detected_at: s3
  - code: PERMISSION_DENIED
    description: Session lacks entitlement to view this member.
    detected_at: s3
policy:
  risk_class: safe
  side_effects: none
  requires_approval_for_unattended: false
  max_runtime_ms: 45000
steps:
  - id: s1
    intent: Open member search from the nav frame
    action: click
    target:
      frame: nav
      rationale: Nav link accessible name is stable across tenants; href is a postback.
      strategies:
        - { kind: ax_role_name, role: link, name: "Member Search", match: exact }
        - { kind: css, value: "a:has-text('Member Search')" }
      match_policy: require_unique
      recorded_rung: 1
    waits:
      after: { kind: navigation_or_ax_change, timeout_ms: 8000 }
    checkpoint:
      kind: any_of
      conditions:
        - { kind: text_present, value: "Member Search" }
        - { kind: text_present, value: "Member ID" }
        - { kind: text_present, value: "System Notice" }
        - { kind: text_present, value: "Internal Server Error" }
        - { kind: text_present, value: "Your session has expired" }
    risk: safe
  - id: s2
    intent: Enter the member ID into the search field
    action: type
    target:
      frame: content
      rationale: Label "Member ID" is a sibling td; id attributes churn per tenant.
      strategies:
        - { kind: ax_role_name, role: textbox, name: "Member ID", match: exact }
        - { kind: ax_label_proximity, label: "Member ID", direction: right, max_distance: 2 }
        - { kind: table_cell_neighbour, label_text: "Member ID", cell_offset: [0, 1] }
        - { kind: css, value: "input[id$='txt1'], input[id$='srch_q']" }
      match_policy: require_unique
      recorded_rung: 2
    value: { from_input: member_id }
    checkpoint:
      kind: ax_value_equals
      role: textbox
      name: "Member ID"
      expected: { from_input: member_id }
    risk: safe
  - id: s3
    intent: Submit the member search
    action: click
    target:
      frame: content
      strategies:
        - { kind: ax_role_name, role: button, name: "Find", match: exact }
        - { kind: css, value: "input[type=submit]" }
      match_policy: require_unique
      recorded_rung: 1
    waits:
      after: { kind: navigation_or_ax_change, timeout_ms: 12000 }
    checkpoint:
      kind: any_of
      conditions:
        - { kind: ax_present, role: heading, name_matches: "^Member .* Detail$" }
        - { kind: text_present, value: "No records found" }
        - { kind: text_present, value: "not authorized" }
        - { kind: text_present, value: "Internal Server Error" }
        - { kind: text_present, value: "Your session has expired" }
        - { kind: text_present, value: "Member" }
    expectations:
      - when: { kind: text_present, value: "No records found" }
        classify: business_outcome
        outcome: MEMBER_NOT_FOUND
        halt: true
      - when: { kind: text_matches, value: "not authori[sz]ed|entitlement" }
        classify: business_outcome
        outcome: PERMISSION_DENIED
        halt: true
    risk: safe
  - id: s4
    intent: Read the savings balance from the member detail panel
    action: extract
    target:
      frame: content
      strategies:
        - { kind: ax_label_proximity, label: "Savings Balance", direction: right, max_distance: 2 }
        - { kind: table_cell_neighbour, label_text: "Savings Balance", cell_offset: [0, 1] }
        - { kind: regex_in_region, region_anchor: "Savings", pattern: "\\$[0-9,]+\\.[0-9]{2}" }
      match_policy: first
    extract_to: savings_balance
    checkpoint: { kind: matches, pattern: "\\$[0-9,]+\\.[0-9]{2}" }
    risk: safe
  - id: s5
    intent: Read account status
    action: extract
    target:
      frame: content
      strategies:
        - { kind: ax_label_proximity, label: "Status", direction: right, max_distance: 2 }
        - { kind: table_cell_neighbour, label_text: "Status", cell_offset: [0, 1] }
      match_policy: first
    extract_to: account_status
    risk: safe
  - id: s6
    intent: Done
    action: finish
    status: success
    risk: safe
reliability:
  replays: 0
  successes: 0
provenance:
  discovered_by: seed
  compiler_version: "1.0.0"
