    adapter: web_aria/1
  app:
    product: CoreVantage Servicing
    product_version: '9.4'
    tenant_scope: base
    entry:
      url_template: '{base_url}/servicing/home'
      requires_session: true
  allowlist_ref: policies/corevantage.yaml
inputs:
