  pattern: ^[0-9]{6}$
  sensitivity: identifier
  description:
  example: '100234'
  default:
  values:
- name: username
  type: string
  required: false
  pattern:
  sensitivity: secret
  description:
  example:
  default: teller
  values:
- name: password
  type: string
  required: false
  pattern:
  sensitivity: secret
  description:
  example:
  default: teller
  values:
- name: base_url
  type: string
  required: false
  pattern:
  sensitivity: public
  description:
  example:
  default: http://127.0.0.1:8081
  values:
outputs:
- name: savings_balance
  type: money
  required: true
  source:
    step: s4
    extractor: ax_text
    transform: parse_money
  sensitivity: pii
  values:
- name: account_status
  type: enum
  required: false
  source:
    step: s5
    extractor: ax_text
    transform: lower_trim
  sensitivity: identifier
  values:
  - active
  - dormant
  - frozen
outcomes:
